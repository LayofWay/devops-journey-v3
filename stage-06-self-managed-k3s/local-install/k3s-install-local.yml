---
- name: Install k3s Cluster (Local Download Mode)
  hosts: k3s_cluster
  become: yes
  gather_facts: yes
  tasks:
    - name: Disable swap temporarily
      command: swapoff -a
      ignore_errors: yes

    - name: Disable swap permanently
      lineinfile:
        path: /etc/fstab
        regexp: '.*swap.*'
        state: absent

    - name: Install prerequisites
      apt:
        name: [curl, apt-transport-https, ca-certificates]
        state: present
        update_cache: yes

# --- ЗАДАЧИ ТОЛЬКО ДЛЯ МАСТЕРА ---
- name: Install k3s on Master
  hosts: master
  become: yes
  tasks:
    - name: Download k3s install script to local machine
      get_url:
        url: https://get.k3s.io
        dest: /tmp/k3s-install.sh
        mode: '0755'
      delegate_to: localhost
      become: no
    
    - name: Download k3s binary to local machine (Обход блокировки GitHub на сервере)
      get_url:
        url: https://github.com/k3s-io/k3s/releases/download/v1.37.2%2Bk3s1/k3s
        dest: /tmp/k3s-binary
        mode: '0755'
      delegate_to: localhost
      become: no

    - name: Copy install script to master server
      copy:
        src: /tmp/k3s-install.sh
        dest: /tmp/k3s-install.sh
        mode: '0755'
  
    - name: Copy k3s binary directly to master server
      copy:
        src: /tmp/k3s-binary
        dest: /usr/local/bin/k3s
        mode: '0755'
    
    - name: Install k3s server from local script (Только Control Plane, без worker-нагрузки)
      shell: INSTALL_K3S_SKIP_DOWNLOAD=true /tmp/k3s-install.sh
      
    - name: Wait for k3s to be ready
      wait_for:
        path: /etc/rancher/k3s/k3s.yaml
        timeout: 60

    - name: Read k3s node token
      command: cat /var/lib/rancher/k3s/server/node-token
      register: k3s_token_result
      changed_when: false

    - name: Save token to local file for workers
      copy:
        content: "{{ k3s_token_result.stdout }}"
        dest: /tmp/k3s_token.txt
      delegate_to: localhost
      become: no

    - name: Save master IP to local file
      copy:
        content: "{{ inventory_hostname }}"
        dest: /tmp/k3s_master_ip.txt
      delegate_to: localhost
      become: no

    - name: Download k3s.yaml to local machine
      fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: ~/k3s-config-local.yaml
        flat: yes

    - name: Update server IP in local k3s-config.yaml
      shell: "sed -i 's/127.0.0.1/{{ inventory_hostname }}/g; s/localhost/{{ inventory_hostname }}/g' ~/k3s-config-local.yaml"
      delegate_to: localhost
      become: no

    - name: Taint master node to repel regular workloads
      command: kubectl --kubeconfig ~/k3s-config-local.yaml taint nodes k3s-master node-role.kubernetes.io/control-plane:NoSchedule
      delegate_to: localhost
      become: no
      failed_when: false # Игнорируем ошибку, если тейнт уже существует
    
# --- ЗАДАЧИ ТОЛЬКО ДЛЯ WORKER ---
- name: Join Workers to k3s Cluster
  hosts: workers
  become: yes
  tasks:
    - name: Read token from localhost
      set_fact:
        k3s_token: "{{ lookup('file', '/tmp/k3s_token.txt') | trim }}"
      delegate_to: localhost
      become: no

    - name: Read master IP from localhost
      set_fact:
        master_ip: "{{ lookup('file', '/tmp/k3s_master_ip.txt') | trim }}"
      delegate_to: localhost
      become: no

    - name: Download k3s install script to local machine (for workers)
      get_url:
        url: https://get.k3s.io
        dest: /tmp/k3s-install-worker.sh
        mode: '0755'
      delegate_to: localhost
      become: no

    - name: Copy install script to worker server
      copy:
        src: /tmp/k3s-install-worker.sh
        dest: /tmp/k3s-install.sh
        mode: '0755'

    - name: Install k3s agent from local script
      shell: "K3S_URL=https://{{ master_ip }}:6443 K3S_TOKEN={{ k3s_token }} /tmp/k3s-install.sh --with-node-id"

# --- УСТАНОВКА ARGOCD ---
- name: Install ArgoCD
  hosts: master
  become: yes
  tasks:
    - name: Create ArgoCD namespace
      command: kubectl --kubeconfig ~/k3s-config-local.yaml create namespace argocd
      ignore_errors: yes
      delegate_to: localhost
      become: no

    - name: Install ArgoCD
      command: kubectl --kubeconfig ~/k3s-config-local.yaml apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
      ignore_errors: yes
      delegate_to: localhost
      become: no

    - name: Wait for ArgoCD server to be accessible
      shell: kubectl --kubeconfig ~/k3s-config-local.yaml wait --for=condition=Available deployment/argocd-server -n argocd --timeout=120s
      delegate_to: localhost
      become: no

    - name: Fetch generated ArgoCD admin password from cluster
      shell: kubectl --kubeconfig ~/k3s-config-local.yaml -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d
      register: argocd_fetched_password
      delegate_to: localhost
      become: no
      changed_when: false
      retries: 5
      delay: 10
      until: argocd_fetched_password.stdout != ""

    - name: Save ArgoCD password to local file for safekeeping
      copy:
        content: "{{ argocd_fetched_password.stdout }}\n"
        dest: "~/argocd-admin-password-local.txt"
      delegate_to: localhost
      become: no

    # 🔥 ИСПРАВЛЕНИЕ: Копируем и применяем ТОЛЬКО application.yaml.
    # Секреты репозитория теперь управляются централизованно через argocd-repo-creds-LOCAL.yaml ниже.
    - name: Copy ArgoCD application manifest to master
      copy:
        src: "~/devops-journey-v3/stage-03-kubernetes/manifests/argocd-application.yaml"
        dest: "/tmp/argocd-application.yaml"
      delegate_to: localhost
      become: no

    - name: Apply ArgoCD application
      command: kubectl --kubeconfig ~/k3s-config-local.yaml apply -f /tmp/argocd-application.yaml
      delegate_to: localhost
      become: no

    - name: Install Stakater Reloader
      command: kubectl --kubeconfig ~/k3s-config-local.yaml apply -f https://raw.githubusercontent.com/stakater/Reloader/master/deployments/kubernetes/reloader.yaml
      delegate_to: localhost
      become: no

    - name: Install Stakater Reloader
      command: kubectl --kubeconfig ~/k3s-config-local.yaml apply -f https://raw.githubusercontent.com/stakater/Reloader/master/deployments/kubernetes/reloader.yaml
      delegate_to: localhost
      become: no

    # 🔥 НОВАЯ ЗАДАЧА: Установка Cert-Manager (Фундамент для HTTPS)
    - name: Install Cert-Manager via official YAML
      command: kubectl --kubeconfig ~/k3s-config-local.yaml apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.13.2/cert-manager.yaml
      delegate_to: localhost
      become: no
      retries: 3
      delay: 15
      register: cert_manager_result
      until: cert_manager_result.rc == 0


          # 🔥 НОВАЯ ЗАДАЧА: Даём кластеру 15 секунд, чтобы kubelet начал скачивать образы
    - name: Pause to let kubelet start pulling Cert-Manager images
      pause:
        seconds: 15
      delegate_to: localhost
      become: no

    # 🔥 НОВАЯ ЗАДАЧА: Ждём вебхук с увеличенным таймаутом (120 секунд вместо 60)
    - name: Wait for Cert-Manager webhook to be ready (Увеличенный таймаут для 2GB RAM)
      shell: kubectl --kubeconfig ~/k3s-config-local.yaml wait --for=condition=Available deployment/cert-manager-webhook -n cert-manager --timeout=120s
      delegate_to: localhost
      become: no
      register: webhook_wait_result
      retries: 2          # Если вдруг снова не уложится, дадим второй шанс
      delay: 15           # Ждём 15 секунд перед второй попыткой
      until: webhook_wait_result.rc == 0
     
    # 🔥 НОВАЯ ЗАДАЧА: Создаём ClusterIssuer для Let's Encrypt
    - name: Apply Let's Encrypt ClusterIssuer
      command: kubectl --kubeconfig ~/k3s-config-local.yaml apply -f ~/devops-journey-v3/stage-03-kubernetes/manifests/letsencrypt-issuer.yaml
      delegate_to: localhost
      become: no
      retries: 3
      delay: 15
      register: issuer_result
      until: issuer_result.rc == 0

        # 🔥 ПОЛНАЯ И УСТОЙЧИВАЯ АВТОМАТИЗАЦИЯ ARGOCD IMAGE UPDATER 🔥
    
    - name: Pause to let the cluster stabilize after Cert-Manager
      pause:
        seconds: 20
      delegate_to: localhost
      become: no

    - name: Install ArgoCD Image Updater
      command: kubectl --kubeconfig ~/k3s-config-local.yaml apply -n argocd -f https://raw.githubusercontent.com/argoproj-labs/argocd-image-updater/stable/config/install.yaml
      delegate_to: localhost
      become: no
      retries: 5
      delay: 15
      register: image_updater_result
      until: image_updater_result.rc == 0

    - name: Wait for ArgoCD Image Updater to be ready (Отличная практика, оставляем!)
      command: kubectl --kubeconfig ~/k3s-config-local.yaml wait --for=condition=Available deployment/argocd-image-updater-controller -n argocd --timeout=120s
      delegate_to: localhost
      become: no
      ignore_errors: yes # На случай, если wait упадет, но поды в итоге запустятся

    - name: Apply Image Updater ConfigMap (Заменяет собой команду patch, это чище и надежнее)
      command: kubectl --kubeconfig ~/k3s-config-local.yaml apply -f ~/devops-journey-v3/stage-03-kubernetes/manifests/updater-configmap.yaml
      delegate_to: localhost
      become: no

    - name: Apply Image Updater CRD
      command: kubectl --kubeconfig ~/k3s-config-local.yaml apply -f ~/devops-journey-v3/stage-03-kubernetes/manifests/image-updater.yaml
      delegate_to: localhost
      become: no

    - name: Apply ArgoCD Repository Credentials (for Image Updater write-back)
      command: kubectl --kubeconfig ~/k3s-config-local.yaml apply -f ~/devops-journey-v3/stage-03-kubernetes/manifests/argocd-repo-creds-LOCAL.yaml
      delegate_to: localhost
      become: no

    - name: Restart Image Updater to guarantee it reads the new ConfigMap and Secret
      command: kubectl --kubeconfig ~/k3s-config-local.yaml rollout restart deployment argocd-image-updater-controller -n argocd
      delegate_to: localhost
      become: no
