name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'stage-02-docker/app/app.py'
      - 'stage-02-docker/app/Dockerfile'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./stage-02-docker/app/
          push: true
          tags: |
            # Оставляем latest для ручного деплоя, если нужно
            ${{ secrets.DOCKER_USERNAME }}/devops-flask-app:latest
            # 🔥 ДОБАВЛЯЕМ УНИКАЛЬНЫЙ SEMVER ТЕГ НА ОСНОВЕ НОМЕРА ЗАПУСКА
            ${{ secrets.DOCKER_USERNAME }}/devops-flask-app:v1.0.${{ github.run_number }}
