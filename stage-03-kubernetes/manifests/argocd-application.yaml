apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/LayofWay/devops-journey-v3.git
    targetRevision: HEAD
    # 🔥 МЕНЯЕМ ПУТЬ: теперь ArgoCD смотрит в папку с Helm-чартом
    path: stage-03-kubernetes/devops-app-chart
    # 🔥 ГОВОРИМ ARGOCD, ЧТО ЭТО HELM, И ПЕРЕДАЁМ ЕМУ values.yaml
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
