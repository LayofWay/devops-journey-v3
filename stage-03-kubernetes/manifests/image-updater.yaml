apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: devops-app-updater
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: "devops-app"
      images:
        - alias: "flaskapp"
          imageName: "layofway/devops-flask-app"
          commonUpdateSettings:
            updateStrategy: "semver"
            allowTags: "regexp:^v1\\.0\\.[0-9]+$"
          manifestTargets:
            helm:
              name: "image.repository"
              tag: "image.tag"
  
  writeBackConfig:
    method: "git" # 🔥 ПРОСТО "git". Он возьмёт креды из ConfigMap!
    gitConfig:
      repository: "https://github.com/LayofWay/devops-journey-v3.git"
      branch: "main"
      writeBackTarget: "helmvalues:values.yaml"
