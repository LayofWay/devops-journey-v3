apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-image-updater-config
  namespace: argocd
data:
  # Говорим контроллеру использовать API ArgoCD для чтения приложений
  applications_api: argocd
  # Твои креды для Git
  git.credentials: secret:argocd/argocd-image-updater-git-creds#creds
  # Включаем подробные логи, чтобы видеть, что происходит
  log.level: debug
