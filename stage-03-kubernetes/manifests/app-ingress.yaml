apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-app-ingress
  annotations:
    # Говорим cert-manager использовать этот ClusterIssuer для получения сертификата
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: traefik
  # 🔥 ДОБАВЛЯЕМ СЕКЦИЮ TLS
  tls:
    - hosts:
        - app.my-devops-site.ru  # 🔥 ЗАМЕНИ НА СВОЙ ДОМЕН!
      secretName: devops-app-tls # Сюда cert-manager сохранит готовый сертификат
  rules:
    - host: app.my-devops-site.ru # 🔥 ЗАМЕНИ НА СВОЙ ДОМЕН!
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-app-service
                port:
                  number: 80
