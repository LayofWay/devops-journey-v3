apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-app-ingress
  annotations:
    # Эта аннотация говорит Traefik перенаправлять HTTP на HTTPS (на будущее)
    # А пока она просто подтверждает, что мы используем Traefik
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik  # 🔥 ВАЖНО: указываем встроенный контроллер k3s
  rules:
#    - host: devops-app.local  # Домен, по которому будем обращаться
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-app-service  # Куда направлять трафик
                port:
                  number: 80
